<!doctype html><html lang=fr><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1"><title>bv-secrets · login</title>
<link rel=preload as=font type=font/woff2 crossorigin
      href="static/__V__/fonts/monaspace-neon-400.woff2">
<link rel=stylesheet href="static/__V__/css/fonts.css">
<link rel=stylesheet href="static/__V__/css/tokens.css">
<link rel=stylesheet href="static/__V__/css/base.css">
<link rel=stylesheet href="static/__V__/css/components.css">
<link rel=stylesheet href="static/__V__/css/views.css">
<link rel=stylesheet href="static/__V__/css/animations.css">
<link rel=icon type="image/png" href="static/__V__/img/favicon.png">
</head><body class="loginpage">

<!-- Fond anime, sous le formulaire, CENTRE : le formulaire se pose dessus au
     lieu d'etre pose a cote. Reste vide si le CDN three.js est injoignable,
     auquel cas la page reste noire et parfaitement utilisable. -->
<bv-orbs id="loginfx" offset-x="0" aria-hidden="true"></bv-orbs>

<div class="loginwrap"><form class="loginbox" id="loginForm">

<div class="brand">
  <span class="markwrap">
    <span class="ring" aria-hidden="true"></span>
    <span class="ring2" aria-hidden="true"></span>
    <img class="mark" src="static/__V__/img/logo.png" alt="bv-secrets"
         width="132" height="132">
  </span>
</div>

<!-- L'erreur se place entre le sigle et le champ : elle parle du champ, et
     elle ne pousse plus le sigle vers le bas en apparaissant. -->
<p class="err" id="loginErr"></p><!--BV:WARN-->

<!-- Un seul champ. Il prend le mot de passe aujourd'hui, le code TOTP ensuite. -->
<div class="field">
  <input type=password id="pw" placeholder="Mot de passe" autofocus
         autocomplete=current-password spellcheck=false>
</div>

<button class="btn big solid" type=submit>Entrer</button>
</form></div>

<script type="module" src="static/__V__/js/orbs.js"></script>
<script type="module" src="static/__V__/js/login.js"></script>
</body></html>
