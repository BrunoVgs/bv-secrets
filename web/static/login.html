<!doctype html><html lang=fr><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1"><title>bv-secrets · login</title>
<link rel=preconnect href="https://fonts.googleapis.com">
<link rel=preconnect href="https://fonts.gstatic.com" crossorigin>
<link rel=stylesheet href="https://fonts.googleapis.com/css2?family=Michroma&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel=stylesheet href="static/__V__/css/tokens.css">
<link rel=stylesheet href="static/__V__/css/base.css">
<link rel=stylesheet href="static/__V__/css/components.css">
<link rel=stylesheet href="static/__V__/css/views.css">
<link rel=stylesheet href="static/__V__/css/animations.css">
<link rel=icon type="image/png" href="static/__V__/img/favicon.png">
</head><body class="loginpage">

<!-- Animated background, under the form. offset-x NEGATIVE shifts left:
     the shader does `suv.x -= iOffsetX`, a positive value pushes right.
     Stays empty if the three.js CDN is unreachable. -->
<bv-orbs id="loginfx" offset-x="-0.36" aria-hidden="true"></bv-orbs>

<div class="loginwrap"><form class="loginbox" id="loginForm">
<p class="err" id="loginErr"></p><!--BV:WARN-->

<div class="brand">
  <span class="markwrap">
    <span class="ring" aria-hidden="true"></span>
    <span class="ring2" aria-hidden="true"></span>
    <img class="mark" src="static/__V__/img/logo.png" alt="bv-secrets" width="68" height="68">
  </span>
  <div class="n">BV&#8209;SECRETS</div>
</div>

<div class="field">
  <label for="pw">Mot de passe</label>
  <input type=password id="pw" placeholder="••••••••" autofocus autocomplete=current-password>
</div>

<button class="btn big solid" type=submit>Entrer</button>
</form></div>

<script type="module" src="static/__V__/js/orbs.js"></script>
<script type="module" src="static/__V__/js/login.js"></script>
</body></html>
